# 登录流程（GitHub OAuth）：
#   /admin/ 打开弹窗 → /api/auth 302 跳转 GitHub → 用户授权
#   → GitHub 回跳 /api/callback 换取 token → postMessage 握手回到后台
#
# 注意：base_url 必须和管理后台的访问地址完全一致，
# netlify-cms 会校验 postMessage 的来源 origin 等于 base_url。
# 因此请始终使用 https://super-meringue-6c70e2.netlify.app/admin/ 访问后台，
# 不要用 main--super-meringue-6c70e2.netlify.app 之类的分支别名。
backend:
  name: github
  repo: NuhSul423/blog
  branch: main
  base_url: https://super-meringue-6c70e2.netlify.app
  auth_endpoint: api/auth

publish_mode: editorial_workflow
media_folder: source/uploads
public_folder: /uploads

collections:
  - name: 'post'
    label: '文章'
    folder: 'source/_posts'
    create: true
    slug: ':year-:month-:day-:title'
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '日期', name: 'date', widget: 'datetime' }
      - { label: '分类', name: 'categories', widget: 'list', default: ['未分类'] }
      - { label: '标签', name: 'tags', widget: 'list' }
      # modes: ['raw'] 强制使用原始 Markdown 编辑器。
      # netlify-cms 2.x 的富文本（rich_text / Slate）编辑器在中文输入法组合输入
      # 时经常不把内容提交进 entry，保存时会误报「内容 IS REQUIRED」。
      # 想换回富文本编辑器，把这里改成 modes: ['rich_text', 'raw']。
      - { label: '内容', name: 'body', widget: 'markdown', modes: ['raw'] }

  - name: 'page'
    label: '页面'
    files:
      - label: '关于页面'
        name: 'about'
        file: 'source/about/index.md'
        fields:
          - { label: '标题', name: 'title', widget: 'string' }
          - { label: '内容', name: 'body', widget: 'markdown', modes: ['raw'] }
      - label: '链接页面'
        name: 'link'
        file: 'source/link/index.md'
        fields:
          - { label: '标题', name: 'title', widget: 'string' }
          - { label: '内容', name: 'body', widget: 'markdown', modes: ['raw'] }
      - label: '工具页面'
        name: 'tools'
        file: 'source/tools/index.md'
        fields:
          - { label: '标题', name: 'title', widget: 'string' }
          - { label: '内容', name: 'body', widget: 'markdown', modes: ['raw'] }